name: Check and create tag

on:
  workflow_run:
    workflows: ["Lint Python code with Ruff"]
    types:
      - completed
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - pyproject.toml

jobs:
  new_version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Get version number
        run: echo "CURR_VER=v$(uv version --short --frozen)" >> "$GITHUB_ENV"

      - name: Check if version exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: mukunku/tag-exists-action@v1.0.0
        id: tagcheck
        with:
          tag: ${{ env.CURR_VER }}

      - name: Make tag
        uses: actions/github-script@v7
        if: steps.tagcheck.outputs.exists == 'false'
        with:
          github-token: ${{ secrets.AUTOTAG_TOKEN }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.CURR_VER}`,
              sha: context.sha
            })

      - name: Fallback
        if: steps.tagcheck.outputs.exists == 'true'
        run: echo "Nothing to see here, move along citizen"
